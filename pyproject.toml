[project]
name = "chesscomp"
version = "0.30"
description = "Solver, analyser and composing assistant for orthodox chess problems (#n, s#n, h#n)"
requires-python = ">=3.10"
dependencies = ["chess>=1.11"]

[project.scripts]
chesscomp = "chesscomp.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
